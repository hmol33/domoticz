[pytest]
# Pytest configuration for Domoticz test suite
testpaths =
    test/python
    test/gherkin
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
markers =
    server: marks tests that require a running Domoticz instance
    static: marks tests that run entirely offline (no server needed)
